<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Badge layout test</title>
    <link rel="stylesheet" href="../content.css">
    <style>
      body { background: #fff; color: #202124; font-family: Arial, "Microsoft YaHei", sans-serif; margin: 40px; }
      .result { width: 652px; }
      .b8lM7 { display: flex; flex-direction: column-reverse; }
      .V9tjod { display: block; transform: scaleY(-1); }
      .ESMNde { display: inline-block; transform: scaleY(-1); }
      .q0vns, .byrV5b { align-items: center; display: flex; }
      .byrV5b { position: relative; }
      .google-menu { height: 20px; left: 213px; position: absolute; width: 34px; }
      .q0vns { height: 38px; }
      .favicon { background: #111; border-radius: 50%; height: 26px; margin-right: 12px; width: 26px; }
      .site { font-size: 14px; line-height: 20px; }
      cite { color: #4d5156; font-size: 12px; font-style: normal; }
      h3 { color: #1a0dab; font-size: 22px; font-weight: 400; margin: 8px 0; transform: scaleY(-1); }
      a { color: inherit; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="result">
      <div class="b8lM7">
        <span class="V9tjod">
          <a href="#">
            <h3>汽水音乐</h3>
            <div class="ESMNde">
              <div class="q0vns">
                <span class="favicon"></span>
                <div>
                  <div class="site">抖音</div>
                  <div class="byrV5b">
                    <cite>https://www.qishui.com › share › album</cite>
                    <span class="google-menu" aria-label="关于这条结果的详细信息">⋮</span>
                    <span class="baidu-official-check-badge" data-status="official">百度官方</span>
                  </div>
                </div>
              </div>
            </div>
          </a>
        </span>
      </div>
      <p>邀请你来「汽水音乐」听歌。</p>
    </div>
  </body>
</html>
