<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>百度官网核验助手</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>百度官网核验助手</h1>
          <p>Google 搜索结果辅助核验</p>
        </div>
        <label class="switch" title="启用或暂停">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </header>

      <section>
        <p class="help">扩展只在 Google 搜索页运行，并通过百度搜索结果中的“官方”标识进行辅助核验。不可用时会明确提示，不会把未知状态判定为非官网。</p>
        <p id="status" role="status" aria-live="polite"></p>

        <div class="actions">
          <button id="clear-cache" type="button" class="secondary">清除缓存</button>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
